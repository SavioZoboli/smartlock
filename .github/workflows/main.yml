name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repo_lc: ${{ steps.repo.outputs.repo_lc }}
    steps:
      - name: Definir nome do repo em minusculo
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # 1. Testes automatizados
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/hmi/package-lock.json
      - name: Instalar dependências (HMI)
        working-directory: src/hmi
        run: npm ci
      - name: Gerar arquivos de environment a partir do template
        working-directory: src/hmi
        run: |
          sed -e "s|API_URL|http://localhost:3000|g" src/environments/environment.template.ts > src/environments/environment.ts
          sed -e "s|API_URL|http://localhost:3000|g" src/environments/environment.template.ts > src/environments/environment.development.ts
      - name: Rodar testes unitários (HMI)
        working-directory: src/hmi
        env:
          CI: true
          NG_CLI_ANALYTICS: false
        run: npx ng test --watch=false

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/api/package-lock.json
      - name: Instalar dependências (API)
        working-directory: src/api
        run: npm ci
      - name: Validar TypeScript e sintaxe das migrations (API)
        working-directory: src/api
        run: |
          npx tsc --noEmit
          for f in migrations/*.js; do node -c "$f"; done

  test-worker-mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/worker-mqtt/package-lock.json
      - name: Instalar dependências (Worker MQTT)
        working-directory: src/worker-mqtt
        run: npm ci
      - name: Validar TypeScript (Worker MQTT)
        working-directory: src/worker-mqtt
        run: npx tsc --noEmit

  # 2. Build e push das imagens Docker (sempre para todos os serviços após testes passarem)
  build-frontend:
    needs: [prepare, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar environment.ts
        env:
          ENV_HMI: ${{ secrets.ENV_HMI }}
        run: |
          echo "$ENV_HMI" > /tmp/env_hmi.env

          API_URL=$(awk -F '=' '/API_URL/ {print $2}' /tmp/env_hmi.env | tr -d ' ' | tr -d '\r')

          sed -e "s|API_URL|$API_URL|g" src/hmi/src/environments/environment.template.ts > src/hmi/src/environments/environment.ts

          sed -e "s|API_URL|$API_URL|g" src/hmi/src/environments/environment.template.ts > src/hmi/src/environments/environment.prod.ts

          rm /tmp/env_hmi.env

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./src/hmi
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.repo_lc }}/hmi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api-dados:
    needs: [prepare, test-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./src/api
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.repo_lc }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker-mqtt:
    needs: [prepare, test-worker-mqtt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./src/worker-mqtt
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.repo_lc }}/worker-mqtt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Aprovação manual (environment: production) + 4. Deploy no servidor (CD)
  #    A primeira ação do deploy no servidor é sempre verificar/executar migrations antes de subir os novos containers.
  deploy:
    needs: [build-frontend, build-api-dados, build-worker-mqtt]
    environment: production
    runs-on: self-hosted
    steps:
      - name: Escrever .env files de forma segura
        env:
          ENV_API_DADOS: ${{ secrets.ENV_API_DADOS }}
          ENV_WORKER_MQTT: ${{ secrets.ENV_WORKER_MQTT }}
        run: |
          echo "$ENV_API_DADOS" > /srv/app/api/.env
          echo "$ENV_WORKER_MQTT" > /srv/app/worker-mqtt/.env
          chmod 600 /srv/app/api/.env /srv/app/worker-mqtt/.env

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Baixar imagens atualizadas
        run: docker compose -f /srv/app/docker-compose.yml pull

      - name: Verificar e executar migrations pendentes (sempre antes do deploy)
        run: docker compose -f /srv/app/docker-compose.yml run --rm api node dist/migrate.js

      - name: Subir serviços atualizados
        run: docker compose -f /srv/app/docker-compose.yml up -d
